[workspace]
resolver = "2"
members = ["senja_teras"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "none"
panic = "abort"
incremental = false

[profile.dev]
panic = "abort"
opt-level = 0
debug = true
strip = "none"

[workspace.dependencies]
libc = "0.2.183"
anyhow = "1.0.102"